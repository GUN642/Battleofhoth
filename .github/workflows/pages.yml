# Veröffentlicht die Web-Version des Spiels (Ordner web/) bei jedem Push automatisch auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [ccr-63173baf-916ave, main, master]
    paths: ['web/**', 'dist/version.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp dist/version.json _site/version.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
